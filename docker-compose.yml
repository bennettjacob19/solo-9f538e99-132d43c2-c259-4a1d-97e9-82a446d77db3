services:
  # Participant 1: release-order registration database.
  registry-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: registry_app
      POSTGRES_PASSWORD: registry_app
      POSTGRES_DB: registry
    command:
      - "postgres"
      - "-c"
      - "max_prepared_transactions=20"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry_app -d registry"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - registry_pgdata:/var/lib/postgresql/data

  # Participant 2: release-quota database.
  quota-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quota_app
      POSTGRES_PASSWORD: quota_app
      POSTGRES_DB: quota
    command:
      - "postgres"
      - "-c"
      - "max_prepared_transactions=20"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quota_app -d quota"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - quota_pgdata:/var/lib/postgresql/data

  # Used by the original row-lock drill.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drill
      POSTGRES_PASSWORD: drill
      POSTGRES_DB: drill
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drill -d drill"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      registry-db:
        condition: service_healthy
      quota-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://drill:drill@db:5432/drill
      REGISTRY_DATABASE_URL: postgresql://registry_app:registry_app@registry-db:5432/registry
      QUOTA_DATABASE_URL: postgresql://quota_app:quota_app@quota-db:5432/quota
      INITIAL_QUOTA: "5"
      DRILL_SESSION_PREFIX: lockdrill
      BLOCK_CONFIRM_SECONDS: "8"
      RELEASE_WAIT_SECONDS: "10"
      DRILL_TTL_SECONDS: "1800"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    stop_grace_period: 30s

volumes:
  pgdata:
  registry_pgdata:
  quota_pgdata:
